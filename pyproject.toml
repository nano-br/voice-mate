[tool.poetry]
name = "voice-mate"
version = "0.1.0"
description = "Voice assistant for Windows: press a hotkey, speak, and the transcription lands in your clipboard. Local Whisper with GPU acceleration."
license = "MIT"
authors = ["Álli Terhorst <alli.terhorst@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/nano-br/voice-mate"
repository = "https://github.com/nano-br/voice-mate"
keywords = ["voice-assistant", "speech-to-text", "whisper", "transcription", "clipboard", "productivity"]
packages = [{ include = "app" }]

[tool.poetry.scripts]
voice-mate = "app.main:main"

[tool.poetry.dependencies]
python = "^3.12"
# Core: sem essas deps o app nem sobe
faster-whisper = "*"
sounddevice = "*"
numpy = "*"
pyperclip = "*"
keyboard = "*"
mouse = "*"
# PyTorch com CUDA: o índice padrão da PyPI entrega torch CPU-only no Windows,
# o que faz o VoxCPM rodar 50-100× mais devagar. Forçamos a build CUDA via
# source explícita do PyTorch.
torch = { source = "pytorch-cu128" }
torchaudio = { source = "pytorch-cu128" }
# Extras opt-in (não instalam por padrão; ver [tool.poetry.extras])
claude-agent-sdk = { version = "*", optional = true }
voxcpm = { version = "*", python = "<3.13", optional = true }
soundfile = { version = "*", optional = true }

[tool.poetry.extras]
claude = ["claude-agent-sdk"]
tts = ["voxcpm", "soundfile"]
all = ["claude-agent-sdk", "voxcpm", "soundfile"]

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
types-pyperclip = "*"
babel = "*"

# ─── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
