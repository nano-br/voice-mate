[tool.poetry]
name = "voice-mate"
version = "0.1.0"
description = "Voice assistant for Windows: press a hotkey, speak, and the transcription lands in your clipboard. Local Whisper with GPU acceleration."
license = "MIT"
authors = ["Álli Terhorst <alli.terhorst@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/nano-br/voice-mate"
repository = "https://github.com/nano-br/voice-mate"
keywords = ["voice-assistant", "speech-to-text", "whisper", "transcription", "clipboard", "productivity"]
packages = [{ include = "app" }]

[tool.poetry.scripts]
voice-mate = "app.main:main"

[tool.poetry.dependencies]
# Travado em 3.12: os wheels ROCm da AMD (torch/torchaudio) são cp312-only e o
# voxcpm exige <3.13. Em 3.13 o `make setup` instala torch CPU silenciosamente.
python = ">=3.12,<3.13"
# Core: sem essas deps o app nem sobe
faster-whisper = "*"
sounddevice = "*"
numpy = "*"
pyperclip = "*"
keyboard = "*"
mouse = "*"
# PyTorch (torch/torchaudio) NÃO é declarado aqui de propósito: o build correto
# depende da placa (CUDA cu128 p/ NVIDIA, ROCm p/ AMD, CPU como fallback) e os
# wheels ROCm nem estão no PyPI. Quem instala é `app.setup.gpu_bootstrap`, via
# `make setup` / `make configure`, que detecta a GPU e roda o pip certo.
# omnivoice/voxcpm/openai-whisper dependem de torch — o setup instala o torch por
# último (--force-reinstall) para o build da placa prevalecer sobre o CPU-only do PyPI.
# Extras opt-in (não instalam por padrão; ver [tool.poetry.extras])
claude-agent-sdk = { version = "*", optional = true }
omnivoice = { version = "*", optional = true }
kokoro = { version = "*", optional = true }
voxcpm = { version = "*", python = "<3.13", optional = true }
soundfile = { version = "*", optional = true }
openai-whisper = { version = "*", optional = true }
silero-vad = { version = "*", optional = true }
# Linux: hotkeys globais (pynput p/ X11, evdev p/ Wayland — evdev só compila em Linux)
pynput = { version = "*", optional = true }
evdev = { version = "*", optional = true, markers = "sys_platform == 'linux'" }

[tool.poetry.extras]
claude = ["claude-agent-sdk"]
# tts = engine padrão (OmniVoice). Engines alternativos: kokoro (leve, vozes
# fixas — precisa de espeak-ng no sistema) e voxcpm (mais pesado).
tts = ["omnivoice", "soundfile"]
kokoro = ["kokoro", "soundfile"]
voxcpm = ["voxcpm", "soundfile"]
# Whisper na GPU AMD: openai-whisper roda sobre o torch+ROCm que o setup instala.
# silero-vad corta silêncio em áudio longo (o openai-whisper não tem VAD embutido).
whisper-gpu = ["openai-whisper", "silero-vad"]
# Linux nativo/WSL2: listeners de hotkey (pynput/evdev). No WSL2 o gatilho é o
# daemon HTTP (sem dependência extra), mas o extra cobre o Linux nativo.
linux = ["pynput", "evdev"]
all = ["claude-agent-sdk", "omnivoice", "kokoro", "voxcpm", "soundfile", "openai-whisper", "silero-vad", "pynput", "evdev"]

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
types-pyperclip = "*"
babel = "*"

# ─── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
