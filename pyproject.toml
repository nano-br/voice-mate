[tool.poetry]
name = "voice-mate"
version = "0.1.0"
description = "Voice assistant for Windows: press a hotkey, speak, and the transcription lands in your clipboard. Local Whisper with GPU acceleration."
license = "MIT"
authors = ["Álli Terhorst <alli.terhorst@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/nano-br/voice-mate"
repository = "https://github.com/nano-br/voice-mate"
keywords = ["voice-assistant", "speech-to-text", "whisper", "transcription", "clipboard", "productivity"]
packages = [{ include = "app" }]

[tool.poetry.scripts]
voice-mate = "app.main:main"

[tool.poetry.dependencies]
python = "^3.12"
faster-whisper = "*"
sounddevice = "*"
numpy = "*"
pyperclip = "*"
keyboard = "*"
mouse = "*"
claude-agent-sdk = "*"

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
types-pyperclip = "*"

# ─── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
