[tool.poetry]
name = "voice-mate"
version = "0.1.0"
description = "Local voice dictation to the clipboard with Whisper, with a Windows tray companion: press a hotkey, speak, paste."
license = "MIT"
authors = ["Álli Terhorst <alli.terhorst@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/nano-br/voice-mate"
repository = "https://github.com/nano-br/voice-mate"
keywords = ["voice-assistant", "speech-to-text", "whisper", "transcription", "clipboard", "productivity"]
packages = [{ include = "app" }]

[tool.poetry.scripts]
voice-mate = "app.main:main"
# Companion (tray app): needs the `ui` extra (PySide6), see docs/installation.md "Companion from source (Windows)".
voice-mate-tray = "app.companion.main:main"

[tool.poetry.dependencies]
# Pinned to 3.12: the AMD ROCm wheels (torch/torchaudio) exist for cp312 only and
# voxcpm requires <3.13. On 3.13 `make setup` would silently install CPU-only torch.
python = ">=3.12,<3.13"
# Core: the app does not even start without these
faster-whisper = "*"
sounddevice = "*"
numpy = "*"
pyperclip = "*"
keyboard = "*"
mouse = "*"
# PyTorch (torch/torchaudio) is NOT declared here on purpose: the right build
# depends on the GPU (CUDA cu128 for NVIDIA, ROCm for AMD, CPU as the fallback) and
# the ROCm wheels are not on PyPI. `app.setup.gpu_bootstrap` installs it, through
# `make setup` / `make configure`, which detects the GPU and runs the right pip.
# omnivoice/voxcpm/openai-whisper depend on torch: setup installs torch last
# (--force-reinstall) so the GPU build wins over the CPU-only one from PyPI.
# Opt-in extras (not installed by default; see [tool.poetry.extras])
claude-agent-sdk = { version = "*", optional = true }
omnivoice = { version = "*", optional = true }
kokoro = { version = "*", optional = true }
voxcpm = { version = "*", python = "<3.13", optional = true }
soundfile = { version = "*", optional = true }
openai-whisper = { version = "*", optional = true }
silero-vad = { version = "*", optional = true }
# Linux: global hotkeys (pynput for X11, evdev for Wayland; evdev only builds on Linux)
pynput = { version = "*", optional = true }
evdev = { version = "*", optional = true, markers = "sys_platform == 'linux'" }
# Companion (tray app), optional on Linux. Mirrors requirements/companion.txt, the
# single source of truth (tests/test_companion_packaging.py checks they match).
pyside6-essentials = { version = ">=6.8", optional = true }
pywin32 = { version = ">=306", optional = true, markers = "sys_platform == 'win32'" }

[tool.poetry.extras]
claude = ["claude-agent-sdk"]
# tts = the engine used when nothing is saved (OmniVoice). Alternatives: kokoro
# (light, fixed voices, needs espeak-ng on the system) and voxcpm (heavier).
tts = ["omnivoice", "soundfile"]
kokoro = ["kokoro", "soundfile"]
voxcpm = ["voxcpm", "soundfile"]
# Whisper on the AMD GPU: openai-whisper runs on the torch+ROCm build that setup installs.
# silero-vad trims silence in long audio (openai-whisper has no built-in VAD).
whisper-gpu = ["openai-whisper", "silero-vad"]
# Native Linux/WSL2: hotkey listeners (pynput/evdev). On WSL2 the trigger is the
# HTTP daemon (no extra dependency), but the extra covers native Linux.
linux = ["pynput", "evdev"]
# Companion (tray app): `poetry install --extras ui` + `make run-tray`. Left out of
# `all` on purpose: the engine (WSL2 daemon, CLI) never needs Qt.
ui = ["pyside6-essentials", "pywin32"]
all = ["claude-agent-sdk", "omnivoice", "kokoro", "voxcpm", "soundfile", "openai-whisper", "silero-vad", "pynput", "evdev"]

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
types-pyperclip = "*"
babel = "*"

# ─── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
